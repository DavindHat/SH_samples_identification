[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sh-analyzer"
version = "0.1.0"
description = "Анализ зон самовосстановления металлизированной плёнки по сканам"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.11",
    "scipy>=1.14.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0.2",
    "huey>=2.5.3",
    "matplotlib>=3.9.2",
    "openpyxl>=3.1.5",
    "watchdog>=5.0",
    "pandas>=2.2.3",
]

[project.scripts]
sh-analyzer = "sh_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["sh_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"