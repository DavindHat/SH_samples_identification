scale:
  dpi: 300
  mm_per_px: null
  auto_ruler: true
  ruler_max_deviation: 0.02

samples:
  exclude_left_frac: 0.10
  expected: null
  min_area_mm2: 300
  close_mm: 2.0
  edge_margin_mm: 1.5
  band_dark_ratio: 0.45
  band_open_mm: 2.0
  band_dilate_mm: 0.5
  split_max_erosion_mm: 15.0
  split_step_mm: 0.5

spots:
  warmth_min: 8
  open_mm: 0.10
  merge_gap_mm: 0.50
  fill_internal_holes: true
  min_diameter_mm: 0.5
  max_area_mm2: 300
  min_solidity: 0.30
  shape_filter_min_px: 60
  possibly_merged_area_mm2: 4.0
  possibly_merged_solidity: 0.55
  allow_light_only: false

halo:
  enabled: false
  delta: 14
  open_mm: 0.15
  close_mm: 0.30
  bg_window_mm: 12.0
  min_area_mm2: 0.2
  max_area_mm2: 300

ruler:
  strip_frac: 0.12
  max_tilt_deg: 6.0
  tilt_step_deg: 0.5
  edge_band_frac: 0.28
  min_ticks: 25
  max_spacing_cv: 0.25
  tick_units_mm: [0.5, 1.0, 2.0, 5.0, 10.0]

frame:
  mode: sample
  include_contours: true
  contour_eps_mm: 0.15

output:
  save_overlay: true
  overlay_max_side: 2200
  save_json: true
  save_debug_masks: false
  save_csv: true
  save_xlsx: true

perf:
  resize_max_side: null
  bg_downscale: 8
  workers: 2
